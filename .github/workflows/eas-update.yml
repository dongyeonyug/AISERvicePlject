name: EAS Update (프론트 자동 배포)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm install
        working-directory: frontend

      - name: EAS Update 배포
        run: npx eas-cli update --channel preview --message "${{ github.event.head_commit.message }}" --non-interactive
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
